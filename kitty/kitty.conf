# ~/.config/kitty/kitty.conf
# Tokyo Night–style theme + sensible defaults
# ─────────────────────────────────────────────

# ── Fonts ──
# Swap font_family for whatever you have installed
# (JetBrains Mono, Fira Code, and Cascadia Code are great choices).
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Enable ligatures except right next to the cursor
disable_ligatures cursor

# ── Window layout ──
window_padding_width      10
hide_window_decorations   titlebar-only
confirm_os_window_close   0
background_opacity         0.95
# background_blur          20   # uncomment on macOS for a nice frosted look

# ── Cursor ──
cursor_shape            beam
cursor_blink_interval   0.5
cursor_stop_blinking_after 10

# ── Scrollback ──
scrollback_lines        10000

# ── Bell ──
enable_audio_bell       no
visual_bell_duration    0.1

# ── Tabs ──
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

# ── Colors: Tokyo Night ──
foreground              #c0caf5
background              #1a1b26
selection_foreground    #1a1b26
selection_background    #c0caf5

cursor                  #c0caf5
cursor_text_color       #1a1b26

url_color               #73daca

# Tab bar colors
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #1a1b26

# Window borders
active_border_color     #7aa2f7
inactive_border_color   #292e42

# The 16 terminal colors
# black
color0                  #15161e
color8                  #414868
# red
color1                  #f7768e
color9                  #f7768e
# green
color2                  #9ece6a
color10                 #9ece6a
# yellow
color3                  #e0af68
color11                 #e0af68
# blue
color4                  #7aa2f7
color12                 #7aa2f7
# magenta
color5                  #bb9af7
color13                 #bb9af7
# cyan
color6                  #7dcfff
color14                 #7dcfff
# white
color7                  #a9b1d6
color15                 #c0caf5

# ── A few handy keybindings ──
map cmd+t       new_tab
map cmd+w       close_tab
map cmd+enter   new_window
map ctrl+shift+enter new_window
# Font size on the fly
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0
